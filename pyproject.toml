[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "building-retrofit-moo-climate"
version = "1.0.0"
description = "Data-driven multi-objective optimization of building energy consumption, indoor discomfort, and CO2 emissions under future climate change and grid decarbonization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Reza" }]
keywords = [
    "multi-objective optimization",
    "building energy",
    "climate change",
    "grid decarbonization",
    "NSGA-II",
    "TOPSIS",
    "SHAP",
    "machine learning",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "catboost>=1.2",
    "xgboost>=2.0",
    "shap>=0.44",
    "pymoo>=0.6",
    "bayesian-optimization>=1.4",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "jupyter>=1.0", "ipykernel>=6.0"]

[project.scripts]
building-retrofit-moo = "building_retrofit_moo.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/building-retrofit-moo-climate"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
